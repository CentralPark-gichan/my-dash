<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다이버전스 스크리너</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1a1a19;--sub:#5f5e5a;--muted:#8a8984;--line:#e4e3dc;--hover:#f1f0ea;--sel:#e8f0fb;--up:#d23f31;--down:#2a6fd6;--acc:#2a78d6;--warn:#c98500;--ok:#1b9e6c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--panel:#1c1c1b;--ink:#f0efec;--sub:#c3c2b7;--muted:#898781;--line:#2f2f2d;--hover:#262624;--sel:#1f2b3d;--up:#ef5b4d;--down:#4a8cf0;--acc:#4a8cf0}}
:root[data-theme="dark"]{--bg:#141413;--panel:#1c1c1b;--ink:#f0efec;--sub:#c3c2b7;--muted:#898781;--line:#2f2f2d;--hover:#262624;--sel:#1f2b3d;--up:#ef5b4d;--down:#4a8cf0;--acc:#4a8cf0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:18px;font-weight:600;margin:0}
.sub{color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--sub);padding:6px 14px;border-radius:8px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);font-size:13px}
.filters label{display:flex;gap:6px;align-items:center;color:var(--sub);white-space:nowrap}
.filters input[type=text],.filters input[type=number],.filters select{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 8px;font:inherit}
.filters input[type=number]{width:72px}
.filters input[type=text]{width:140px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;padding:16px 20px}
@media (max-width:1000px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tablewrap{max-height:calc(100vh - 190px);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:500;cursor:pointer;user-select:none}
th:first-child,td:first-child{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--hover)}
tbody tr.sel{background:var(--sel)}
.up{color:var(--up)}.down{color:var(--down)}
.badge{display:inline-block;padding:1px 6px;border-radius:5px;font-size:11px;background:var(--hover);color:var(--sub)}
.badge.ok{background:rgba(27,158,108,.15);color:var(--ok)}
.count{padding:8px 12px;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line)}
.detail{padding:14px 16px}
.dtitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dtitle b{font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:12px 0}
.kv{background:var(--bg);border-radius:8px;padding:8px 10px}
.kv span{display:block;color:var(--muted);font-size:11px}
.kv b{font-weight:600;font-size:13px;white-space:nowrap}
#price{height:360px}#rsi{height:130px;border-top:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:4px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>다이버전스 스크리너</h1>
  <span class="sub" id="day"></span>
  <div class="tabs"><button data-k="bull" class="on">상승 다이버전스</button><button data-k="bear">하락 다이버전스</button></div>
</header>
<div class="filters">
  <label>검색 <input type="text" id="q" placeholder="종목명·코드"></label>
  <label>시장 <select id="mkt"><option value="">전체</option><option>KOSPI</option><option>KOSDAQ</option></select></label>
  <label>업종 <select id="ind"><option value="">전체</option></select></label>
  <label>최소 점수 <input type="number" id="minScore" value="0" min="0" max="65" step="5"></label>
  <label>거래대금(20일, 억) ≥ <input type="number" id="minVal" value="10" min="0" step="5"></label>
  <label><input type="checkbox" id="fFresh" checked> <b>신호 직후만</b></label>
  <label><input type="checkbox" id="fGrade" checked> <b>등급 A·B만</b> (백테스트 우위)</label>
  <label><input type="checkbox" id="fTrig"> 넥라인 위</label>
  <label><input type="checkbox" id="fRsi"> RSI 50 회복</label>
  <label><input type="checkbox" id="fVol"> 거래량 소진</label>
  <label><input type="checkbox" id="fFlow"> 외인+기관 5일 순매수</label>
</div>
<main>
  <section class="card">
    <div class="count" id="count"></div>
    <div class="tablewrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
  </section>
  <section class="card">
    <div class="detail" id="detail"><div class="empty">왼쪽 목록에서 종목을 누르면 일봉 차트가 나옵니다.</div></div>
    <div id="price"></div><div id="rsi"></div>
    <div class="detail" style="padding-top:6px">
      <div class="legend"><span><i style="background:#eda100"></i>20일선</span><span><i style="background:#8e6bd6"></i>60일선</span><span><i style="background:#1b9e6c;height:3px"></i>다이버전스 연결선</span><span><i style="border-top:2px dashed #1b9e6c;height:0"></i>넥라인</span><span><i style="border-top:2px dashed #d23f31;height:0"></i>무효화 가격</span></div>
      <div class="note">백테스트(2023-01~2026-11, 거래대금 10억+, 바닥2 확정일 종가 진입, 시장 동일가중 대비): 등급 A 20일 +2.8%·40일 +4.8%·승률 59% (92건) / A·B 20일 +1.3%·승률 50% (443건) / 고전적 다이버전스만은 우위 없음. 거래비용·상장폐지 종목 미반영. 무효화: 종가가 바닥2 종가 이탈.</div>
    </div>
  </section>
</main>

const fmt = (v, d = 0) => v == null ? '–' : Number(v).toLocaleString('ko-KR', {maximumFractionDigits: d, minimumFractionDigits: d});

const day = DATA.day;

let kind = 'bull', sortKey = 'score', sortDir = -1, selected = null;
const COLS = [
  ['name', '종목'], ['grade', '등급'], ['stage', '단계'], ['close', '종가'], ['pct', '등락'], ['score', '점수'],
  ['low_diff_pct', '바닥차%'], ['vol_ratio', '거래량비'], ['from_high_pct', '52주고점比%'], ['move_from_p2_pct', '바닥2 대비%'], ['rsi_gap', 'RSI차'],
  ['flow5', '외인+기관 5일'], ['avg_value_20d_eok', '거래대금(억)'], ['industry', '업종']
];
DATA.rows.forEach(r => { r.flow5 = (r.foreign_5d ?? 0) + (r.organ_5d ?? 0); });
const inds = [...new Set(DATA.rows.map(r => (r.industry || '').split('|')[0]).filter(Boolean))].sort();
$('#ind').innerHTML += inds.map(i => `<option>${i}</option>`).join('');
$('#head').innerHTML = COLS.map(([k, t]) => `<th data-k="${k}">${t}</th>`).join('');

function filtered() {
  const q = $('#q').value.trim(), mkt = $('#mkt').value, ind = $('#ind').value;
  const minS = +$('#minScore').value || 0, minV = +$('#minVal').value || 0;
  return DATA.rows.filter(r => r.kind === kind
    && (!q || r.name.includes(q) || r.code.includes(q))
    && (!mkt || r.market === mkt)
    && (!ind || (r.industry || '').split('|')[0] === ind)
    && r.score >= minS && (r.avg_value_20d_eok ?? 0) >= minV
    && (!$('#fFresh').checked || r.fresh)
    && (!$('#fGrade').checked || r.grade === 'A' || r.grade === 'B')
    && (!$('#fTrig').checked || r.triggered)
    && (!$('#fRsi').checked || r.rsi_cross_50)
    && (!$('#fVol').checked || (r.vol_ratio != null && r.vol_ratio < 1))
    && (!$('#fFlow').checked || (kind === 'bull' ? r.flow5 > 0 : r.flow5 < 0)))
    .sort((a, b) => {
      const x = a[sortKey], y = b[sortKey];
      if (typeof x === 'string' || typeof y === 'string') return sortDir * String(x ?? '').localeCompare(String(y ?? ''));
      return sortDir * ((x ?? -1e18) - (y ?? -1e18));
    });
}

function render() {
  const rows = filtered();
  $('#count').textContent = `${rows.length}종목 · 헤더를 누르면 정렬`;
  $('#body').innerHTML = rows.map(r => `<tr data-c="${r.code}" class="${selected === r.code ? 'sel' : ''}">
    <td><b>${r.name}</b> <span class="sub">${r.code} · ${r.market}</span></td>
    <td><span class="badge ${r.grade === 'A' ? 'ok' : ''}">${r.grade || '–'}</span></td>
    <td><span class="badge ${r.fresh ? 'ok' : ''}">${r.stage || '–'}</span></td>
    <td>${fmt(r.close)}</td><td class="${sign(r.pct)}">${fmt(r.pct, 2)}%</td>
    <td><b>${fmt(r.score, 1)}</b></td><td>${fmt(r.low_diff_pct, 1)}</td><td>${fmt(r.vol_ratio, 2)}</td>
    <td>${fmt(r.from_high_pct, 1)}</td><td>${fmt(r.move_from_p2_pct, 1)}</td><td>${fmt(r.rsi_gap, 1)}</td>
    <td class="${sign(r.flow5)}">${fmtK(r.flow5)}</td><td>${fmt(r.avg_value_20d_eok)}</td>
    <td>${(r.industry || '').split('|')[0]}</td></tr>`).join('') || `<tr><td colspan="14" class="empty">조건에 맞는 종목이 없습니다. '신호 직후만'이나 '등급 A·B만'을 꺼 보세요.</td></tr>`;
}

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  kind = b.dataset.k; render();
});
$('#head').onclick = e => { const k = e.target.dataset.k; if (!k) return; sortDir = sortKey === k ? -sortDir : -1; sortKey = k; render(); };
document.querySelectorAll('.filters input,.filters select').forEach(el => el.oninput = render);
$('#body').onclick = e => { const tr = e.target.closest('tr[data-c]'); if (tr) show(tr.dataset.c); };

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let pc, rc;
function makeCharts() {
  const base = {layout: {background: {color: css('--panel')}, textColor: css('--muted'), fontSize: 11},
    grid: {vertLines: {visible: false}, horzLines: {color: css('--line')}},
    rightPriceScale: {borderVisible: false}, timeScale: {borderVisible: false},
    crosshair: {mode: 0}, localization: {locale: 'ko-KR'}};
  $('#price').innerHTML = ''; $('#rsi').innerHTML = '';
  pc = LightweightCharts.createChart($('#price'), {...base, autoSize: true, timeScale: {visible: false}});
  rc = LightweightCharts.createChart($('#rsi'), {...base, autoSize: true, timeScale: {borderVisible: false}});
  pc.timeScale().subscribeVisibleLogicalRangeChange(r => r && rc.timeScale().setVisibleLogicalRange(r));
  rc.timeScale().subscribeVisibleLogicalRangeChange(r => r && pc.timeScale().setVisibleLogicalRange(r));
}

  const t = s.t;
  const cs = pc.addCandlestickSeries({upColor: up, downColor: dn, borderVisible: false, wickUpColor: up, wickDownColor: dn});
  cs.setData(t.map((d, i) => ({time: d, open: s.o[i], high: s.h[i], low: s.l[i], close: s.c[i]})));
  const vs = pc.addHistogramSeries({priceScaleId: 'vol', priceFormat: {type: 'volume'}, lastValueVisible: false, priceLineVisible: false});
  pc.priceScale('vol').applyOptions({scaleMargins: {top: 0.8, bottom: 0}});
  vs.setData(t.map((d, i) => ({time: d, value: s.v[i], color: s.c[i] >= s.o[i] ? up + '55' : dn + '55'})));
  [[20, '#eda100'], [60, '#8e6bd6']].forEach(([n, col]) => {
    const m = ma(s.c, n);
    pc.addLineSeries({color: col, lineWidth: 1, lastValueVisible: false, priceLineVisible: false, crosshairMarkerVisible: false})
      .setData(t.map((d, i) => m[i] == null ? null : {time: d, value: m[i]}).filter(Boolean));
  });
  const p1 = dt(r.p1_date), p2 = dt(r.p2_date);
  pc.addLineSeries({color: ok, lineWidth: 3, lastValueVisible: false, priceLineVisible: false})
    .setData([{time: p1, value: r.p1_price}, {time: p2, value: r.p2_price}]);
  cs.setMarkers([p1, p2].map((d, i) => ({time: d, position: bull ? 'belowBar' : 'aboveBar', color: ok,
    shape: bull ? 'arrowUp' : 'arrowDown', text: i ? '2' : '1'})));
  cs.createPriceLine({price: r.trigger_price, color: ok, lineStyle: 2, lineWidth: 1, axisLabelVisible: true, title: '넥라인'});
  cs.createPriceLine({price: r.invalidation, color: up, lineStyle: 2, lineWidth: 1, axisLabelVisible: true, title: '무효'});
  const rs = rc.addLineSeries({color: css('--acc'), lineWidth: 1.5, priceLineVisible: false});
  rs.setData(t.map((d, i) => s.r[i] == null ? null : {time: d, value: s.r[i]}).filter(Boolean));
  [[70, css('--muted')], [50, css('--line')], [30, css('--muted')]].forEach(([v, col]) =>
    rs.createPriceLine({price: v, color: col, lineStyle: 2, lineWidth: 1, axisLabelVisible: false}));
  rc.addLineSeries({color: ok, lineWidth: 3, lastValueVisible: false, priceLineVisible: false})
    .setData([{time: p1, value: r.p1_rsi}, {time: p2, value: r.p2_rsi}]);
  rc.priceScale('right').applyOptions({autoScale: false, scaleMargins: {top: 0.1, bottom: 0.1}});
  rs.applyOptions({autoscaleInfoProvider: () => ({priceRange: {minValue: 10, maxValue: 90}})});
  const n = t.length, range = {from: n - 120, to: n + 3};
  requestAnimationFrame(() => { pc.timeScale().setVisibleLogicalRange(range); rc.timeScale().setVisibleLogicalRange(range); });
}

render();
const first = filtered()[0];
if (first) show(first.code);
</script>
</body>
</html>
